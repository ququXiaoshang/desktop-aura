<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>灵动桌面设置</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <div class="panel">
    <header class="topbar">
      <h1>灵动桌面</h1>
      <span class="version">v0.2.0</span>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="effects">动效</button>
      <button class="tab" data-tab="groups">分组</button>
      <button class="tab" data-tab="about">关于</button>
    </nav>

    <section class="tab-content" id="tab-effects">
      <p class="sub">拖动滑块实时预览效果，改动自动保存</p>
      <div class="field">
        <label>上浮高度 <span id="liftY-val" class="val">10px</span></label>
        <input type="range" id="liftY" min="2" max="30" step="1" value="10" />
      </div>
      <div class="field">
        <label>放大比例 <span id="scale-val" class="val">1.07</span></label>
        <input type="range" id="scale" min="100" max="130" step="1" value="107" />
      </div>
      <div class="field">
        <label>动画时长 <span id="duration-val" class="val">0.28s</span></label>
        <input type="range" id="duration" min="10" max="80" step="1" value="28" />
      </div>
      <div class="field">
        <label>弹性曲线</label>
        <select id="easing">
          <option value="cubic-bezier(0.22, 1.4, 0.36, 1)">弹性回弹（推荐）</option>
          <option value="cubic-bezier(0.34, 1.56, 0.64, 1)">强烈回弹</option>
          <option value="cubic-bezier(0.25, 0.8, 0.25, 1)">平滑柔和</option>
          <option value="cubic-bezier(0.4, 0, 0.2, 1)">快速干脆</option>
          <option value="ease">线性标准</option>
        </select>
      </div>
      <button id="reset">恢复默认</button>
    </section>

    <section class="tab-content" id="tab-groups" hidden>
      <div class="groups-head">
        <span class="groups-title">分组管理</span>
        <button id="add-group" class="primary">＋ 新建分组</button>
      </div>
      <p class="hint">在这里改名、删除分组；把图标拖进/拖出分组请在桌面上操作。</p>
      <div id="group-list"></div>
    </section>

    <section class="tab-content" id="tab-about" hidden>
      <div class="about">
        <p class="about-title">灵动桌面 Aura</p>
        <p class="about-desc">让 Windows 桌面灵动起来：图标上浮动效、收纳分组、壁纸毛玻璃质感。</p>
        <p class="about-ver">版本 0.2.0</p>
        <p class="about-tip">托盘菜单可切换「灵动桌面 / 原生桌面」、设置开机自启。</p>
      </div>
    </section>
  </div>
  <script src="settings.js"></script>
</body>
</html>
